{% extends "base.html" %}

{% block content %}
<style>
    .case-study-detail-container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    body.dark-mode .case-study-detail-container {
        background: var(--dark-surface);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .case-study-header {
        text-align: center;
        margin-bottom: 2rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid #e2e8f0;
    }
    
    body.dark-mode .case-study-header {
        border-bottom: 1px solid var(--dark-surface-secondary);
    }

    .case-study-title {
        background: linear-gradient(45deg, #1a2a6c, #b21f1f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
    }
    
    body.dark-mode .case-study-title {
        background: linear-gradient(45deg, #4cc9f0, #7209b7);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .case-study-date {
        color: #718096;
    }
    
    body.dark-mode .case-study-date {
        color: var(--dark-text-secondary);
        font-size: 1.1rem;
    }

    .case-study-content {
        line-height: 1.8;
        color: #2d3748;
        font-size: 1.1rem;
    }

    .back-button {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(45deg, #1a2a6c, #b21f1f);
        color: white;
        text-decoration: none;
        border-radius: 5px;
        transition: opacity 0.3s ease;
    }

    .back-button:hover {
        opacity: 0.9;
    }

    .back-button i {
        margin-right: 0.5rem;
    }
</style>

<div class="case-study-detail-container">
    <div class="case-study-header">
        <h1 class="case-study-title">{{ case_study.title }}</h1>
        <div class="case-study-date">{{ case_study.date }}</div>
    </div>

    <div class="case-study-content">
        {{ case_study.content|safe }}
    </div>

    <a href="{{ url_for('case_studies_page') }}" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to Case Studies
    </a>
</div>
{% endblock %}
