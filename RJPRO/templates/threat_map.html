<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <style>
        .threat-map-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        .threat-map-iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        body.dark-mode .loading-overlay {
            background-color: var(--dark-bg);
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        body.dark-mode .loading-spinner {
            border: 4px solid #2d3748;
            border-top: 4px solid #60a5fa;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="threat-map-container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
        </div>
        <iframe 
            src="https://threatmap.checkpoint.com/" 
            class="threat-map-iframe"
            id="threatMapFrame"
            allow="fullscreen"
            onload="hideLoading()"
        ></iframe>
    </div>

<script>
    function hideLoading() {
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    // Handle iframe loading errors
    document.getElementById('threatMapFrame').onerror = function() {
        document.getElementById('loadingOverlay').innerHTML = 
            '<p>Error loading threat map. Please refresh the page or try again later.</p>';
    };
</script>
</body>
</html>
